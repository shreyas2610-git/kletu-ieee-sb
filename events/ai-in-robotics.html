<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI in Robotics — IEEE KLETU Student Branch</title>
  <meta name="description" content="AI in Robotics Event Details">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>

  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/event-detail.css">
</head>
<body>

  <a href="#main" class="skip-link">Skip to main content</a>

  <!-- NAVBAR -->
  <header class="navbar" id="navbar">
    <div class="navbar__wrap">
      <a href="../index.html" class="navbar__logo">
        <img src="../assets/images/logo.webp" alt="IEEE KLETU Logo" class="navbar__logo-img">
      </a>
      <nav class="navbar__inner">
        <ul class="navbar__links" id="navLinks">
          <li><a href="../index.html">Home</a></li>
          <li><a href="../upcoming-events.html">Upcoming events</a></li>
          <li><a href="../past-events.html">Past events</a></li>
          <li><a href="../societies.html">Societies</a></li>
          <li><a href="../achievements.html">Achievements</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- MAIN ARTICLE -->
  <main id="main" class="event-detail-page">
    <article class="container event-detail">
      
      <!-- Back Link -->
      <nav aria-label="Breadcrumb" class="event-detail__breadcrumb">
        <a href="../upcoming-events.html" class="event-detail__back">
          <i class="ph ph-arrow-left" aria-hidden="true"></i>
          <span>Back to events</span>
        </a>
      </nav>

      <!-- Hero Header -->
      <header class="event-detail__header">
        <h1 id="cms-title" class="event-detail__title">AI in Robotics</h1>
        <p id="cms-summary" class="event-detail__excerpt">Summary</p>

        <!-- Meta list -->
        <dl class="event-detail__meta">
          <div class="event-detail__meta-item">
            <dt><i class="ph ph-calendar-blank" aria-hidden="true"></i> Date</dt>
            <dd id="cms-date">Feb 13, 2026</dd>
          </div>
          <div class="event-detail__meta-item">
            <dt><i class="ph ph-map-pin" aria-hidden="true"></i> Venue</dt>
            <dd id="cms-venue">SME Seminar Hall</dd>
          </div>
        </dl>
      </header>

      <!-- Banner image -->
      <div id="cms-banner-wrap" class="event-detail__media" style="display:none;">
        <img id="cms-banner" src="" alt="Event Banner" class="event-detail__img">
      </div>

      <!-- TipTap Rendered Article Body -->
      <div id="cms-content" class="event-detail__body">
        <p>Loading published event article...</p>
      </div>

    </article>
  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="container footer__bottom">
      <p>&copy; <span data-year>2026</span> IEEE KLETU Student Branch. All rights reserved.</p>
    </div>
  </footer>

  <!-- Script to load content_html from local CMS API -->
  <script>
    (function() {
      var slug = window.location.pathname.split('/').pop().replace('.html', '');
      fetch('http://localhost:5000/api/v1/public/events/' + slug)
        .then(function(res) { return res.json(); })
        .then(function(data) {
          if (data && data.event) {
            var ev = data.event;
            document.getElementById('cms-title').textContent = ev.title;
            if (ev.summary) document.getElementById('cms-summary').textContent = ev.summary;
            if (ev.location) document.getElementById('cms-venue').textContent = ev.location;
            if (ev.event_date) document.getElementById('cms-date').textContent = new Date(ev.event_date).toLocaleDateString();
            if (ev.banner_url) {
              document.getElementById('cms-banner-wrap').style.display = 'block';
              document.getElementById('cms-banner').src = ev.banner_url;
            }
            if (ev.content_html) {
              document.getElementById('cms-content').innerHTML = ev.content_html;
            }
          }
        })
        .catch(function(err) { console.log('Local CMS fetch error:', err); });
    })();
  </script>

</body>
</html>
