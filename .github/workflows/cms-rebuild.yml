name: Sync Published Events from Headless CMS

on:
  repository_dispatch:
    types: [event_published, event_unpublished]
  workflow_dispatch:

jobs:
  sync-events:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout static site repo
        uses: actions/checkout@v4

      - name: Fetch published events from Headless CMS API
        run: |
          echo "Fetching published events from Headless CMS API..."
          curl -s https://your-cms-domain.com/api/v1/public/events > cms_response.json
          
          # Process response and write to js/events-data.js
          node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('cms_response.json', 'utf8'));
            if (data && Array.isArray(data.events)) {
              const formatted = data.events.map(ev => ({
                slug: ev.slug,
                title: ev.title,
                date: ev.event_date ? ev.event_date.slice(0, 10) : '',
                image: ev.banner_url || 'assets/images/logo.webp',
                description: ev.summary || '',
                category: 'Event',
                priority: 10,
                slider: true,
                detailUrl: 'events/' + ev.slug + '.html'
              }));
              const fileContent = '/* Auto-generated by GitHub Action from Headless CMS */\n(function () {\n  \'use strict\';\n  window.EVENTS = ' + JSON.stringify(formatted, null, 2) + ';\n})();\n';
              fs.writeFileSync('js/events-data.js', fileContent);
              console.log('Successfully updated js/events-data.js with ' + formatted.length + ' published events.');
            }
          "
          rm -f cms_response.json

      - name: Commit and push updated event listings
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: sync published events from Headless CMS dispatch"
          branch: main
